; ============================================================
;  Smart Irrigation System – PlatformIO Configuration
;  ESP32 DOIT DevKit v1
; ============================================================

; ── Project-level source directory ─────────────────────────
; arduino_src/ contains the full Arduino firmware (main.cpp).
; The ESP-IDF env overrides this with its own CMakeLists.txt.
[platformio]
default_envs = esp32doit-arduino
src_dir = arduino_src

; ── Shared settings ────────────────────────────────────────
[common]
monitor_speed   = 115200
monitor_filters = direct, esp32_exception_decoder

; ── Arduino build (FULL system firmware) ───────────────────
;   Build:   pio run  -e esp32doit-arduino
;   Upload:  pio run  -e esp32doit-arduino -t upload
;   Monitor: pio device monitor
[env:esp32doit-arduino]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps =
    adafruit/DHT sensor library @ ^1.4.7
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    h2zero/NimBLE-Arduino @ ^1.4.2
    blynkkk/Blynk @ ^1.3.2

; ── ESP-IDF build (sensor component library / stub only) ───
; Uses its own CMakeLists.txt hierarchy – src_dir is ignored.
[env:esp32doit-devkit-v1]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32doit-devkit-v1
framework = espidf
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
